<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKUNKLA | Account Setup</title><style>body{font:16px system-ui;background:#f4f4f4;color:#222}main{max-width:460px;margin:7vh auto;background:white;padding:30px;border:1px solid #ddd}label{display:block;margin-top:15px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px}button{background:#222;color:white;border:0;margin-top:24px}</style></head><body><main><h1>Set up administrator account</h1><p>This private setup requires a one-time setup code configured in Cloudflare.</p><form id="setup"><label>Email<input type="email" name="email" required value="MoeWalters0099@gmail.com"></label><label>Private setup code<input type="password" name="setupToken" required></label><label>New password<input type="password" name="password" minlength="14" required autocomplete="new-password"></label><button>Create account</button></form><p id="status" role="status"></p><a href="/admin/">Return to sign in</a></main><script>document.getElementById('setup').onsubmit=async e=>{e.preventDefault();const f=e.target;const b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/admin-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const x=await r.json();if(r.ok){location.assign('/admin/?created=1')}else document.getElementById('status').textContent=x.error||'Setup failed'}catch{document.getElementById('status').textContent='Unable to connect'}finally{b.disabled=false}};</script></body></html>
