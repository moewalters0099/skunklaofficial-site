<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKUNKLA | Administrator Sign In</title><link rel="icon" href="../assets/skunk-logo-black.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f3f3;color:#202124;font:16px system-ui,sans-serif}.bar{background:#202124;color:white;padding:20px 5%;font-weight:800;letter-spacing:.1em}main{max-width:440px;margin:8vh auto;background:#fff;padding:32px;border:1px solid #ddd;border-radius:8px;box-shadow:0 8px 30px #0000000b}h1{margin-top:0;font-size:27px}p{line-height:1.55;color:#555}label{display:block;font-weight:650;margin:18px 0 6px}input{width:100%;padding:13px;border:1px solid #999;border-radius:4px;font:inherit}button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:4px;background:#202124;color:white;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.message{min-height:22px;color:#9d2323;font-size:14px}a{color:#333}small{display:block;margin-top:25px;color:#666}</style></head><body><div class="bar">SKUNKLA · ADMIN</div><main><h1>Administrator sign in</h1><p>Sign in with your authorized SKUNKLA administrator email and password.</p><form id="login"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12"><button id="submit" type="submit">Sign in</button><p class="message" id="message" role="status" aria-live="polite"></p></form><small>Administrator access must first be activated securely by the site owner. Never enter a GitHub token here.</small><p><a href="../index.html">Return to homepage</a></p></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='Checking administrator access…';try{const response=await fetch('/api/admin-login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(response.ok){location.assign('/admin/dashboard.html');return}message.textContent=response.status===503?'Administrator password login has not yet been activated.':'Sign-in failed. Check your credentials.'}catch{message.textContent='Unable to contact the sign-in service.'}finally{button.disabled=false}});</script></body></html>
