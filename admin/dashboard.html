<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin dashboard | SKUNKLA</title>
  <link rel="stylesheet" href="/admin/dashboard.css">
  <script src="/admin/blog-editor.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="#overview">SKUNKLA <span>ADMIN</span></a><div><a href="/">View site</a><button id="logout" type="button">Sign out</button></div></header>
<div id="workspace" class="workspace" hidden>
  <nav aria-label="Dashboard">
    <a href="#overview">Overview</a>
    <a href="#catalog">Catalog</a>
    <a href="#posts-view">Blog posts</a>
    <a href="#account">Account</a>
  </nav>
  <main>
    <section id="overview" data-view>
      <h1>Overview</h1>
      <div class="metrics">
        <a href="#catalog"><strong id="category-count">—</strong>Catalog categories</a>
        <a href="#posts-view"><strong id="published-count">—</strong>Published posts</a>
        <a href="#posts-view"><strong id="draft-count">—</strong>Drafts</a>
      </div>
    </section>
    <section id="catalog" data-view hidden>
      <h1>Catalog</h1>
      <p><a href="/catalog.html">Open public catalog</a></p>
      <label for="catalog-search">Search categories</label>
      <input type="search" id="catalog-search" placeholder="Find a category">
      <p id="catalog-status" role="status"></p>
      <ul id="catalog-links" class="catalog-grid"></ul>
    </section>
    <section id="account" data-view hidden>
      <h1>Account</h1>
      <dl class="panel"><dt>Signed in as</dt><dd id="account-email"></dd><dt>Role</dt><dd>Administrator</dd></dl>
    </section>
    <section id="posts-view" data-view hidden>
      <h1>Blog posts</h1>
      <div id="editor" hidden>
    <section class="panel" aria-label="Select a post">
      <a href="/blog/">View public blog</a>
      <label for="posts">Your posts</label>
      <select id="posts"><option value="">New post</option></select>
    </section>
    <form id="post-form" class="panel">
      <h2 id="form-title">New post</h2>
      <label for="title">Title</label>
      <input id="title" name="title" maxlength="160" required>
      <label for="summary">Summary (optional)</label>
      <textarea id="summary" name="summary" maxlength="500" rows="2"></textarea>
      <label for="body">Article text</label>
      <textarea id="body" name="body" maxlength="50000" rows="12"></textarea>
      <div class="actions">
        <button type="submit" value="draft" id="draft">Save draft</button>
        <button type="submit" value="publish">Publish</button>
      </div>
      <p id="result" role="status"></p>
    </form>
      </div>
    </section>
  </main>
</div>
<p id="status" role="status">Checking session…</p>
</body>
</html>
