name: Convert existing Flower product videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/flower-video-backfill.yml']
permissions:
  contents: write
concurrency:
  group: flower-video-backfill
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download, transcode and check the clips
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          sources = ["https://skunkla.com/wp-content/uploads/2026/06/LK616OG-V.mov", "https://skunkla.com/wp-content/uploads/2026/06/ML206D-V.mov", "https://skunkla.com/wp-content/uploads/2026/06/PILLOWS-ARCADE-EDITION-14G-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/HH728PZ-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720EL-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720HS-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720IS-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720LM-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720MS-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720PE-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/LK720RD-V.mov", "https://skunkla.com/wp-content/uploads/2026/07/TY713CG-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/CF1028GF-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/HT1016SE-V-2.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL1020F1-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL1020L4-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL106G57-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL106GC-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL106GM-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/JL106RC-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/ML925G-V.mov", "https://skunkla.com/wp-content/uploads/2026/10/UN1029WT-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/BR1021RS-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/HT1113CB-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/HT1113SS-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/HT1113WG-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1103PR-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1103RT-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117G30-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117G57-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117G58-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117M2-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117MB-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JL1117R7-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/JW1030RO-V-1.mov", "https://skunkla.com/wp-content/uploads/2026/11/LL1112G47-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/LL1112LC-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/PH1113CB-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/PH1113GL-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/PH1113HC-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/PH1113LC-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/SM1028SB-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/SM1103LCR-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/SM1103SS-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/UN1116RR-V.mov", "https://skunkla.com/wp-content/uploads/2026/11/UN1116RRS-V.mov"]
          output = Path("assets/products/converted")
          output.mkdir(parents=True, exist_ok=True)
          allowed = re.compile(r"https://skunkla\.com/wp-content/uploads/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+\.[mM][oO][vV]")

          def convert(url):
              if not allowed.fullmatch(url):
                  raise ValueError("Unapproved source URL")
              key = hashlib.sha256(url.encode()).hexdigest()
              target = output / (key + ".mp4")
              if target.is_file() and target.stat().st_size:
                  return True
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      source = Path(tmp) / "source.mov"
                      encoded = Path(tmp) / "converted.mp4"
                      subprocess.run(["curl", "-fSs", "--retry", "2", "--max-time", "90",
                                      "--max-filesize", "160000000", "--proto", "=https",
                                      "-o", str(source), url], check=True, timeout=220)
                      for height, quality in [(480, 27), (360, 31)]:
                          subprocess.run(["ffmpeg", "-y", "-nostdin", "-v", "error",
                                          "-protocol_whitelist", "file", "-threads", "2", "-i", str(source),
                                          "-map", "0:v:0", "-map", "0:a:0?", "-vf", f"scale=-2:min({height}\\,ih)",
                                          "-c:v", "libx264", "-threads", "2", "-pix_fmt", "yuv420p",
                                          "-preset", "veryfast", "-crf", str(quality),
                                          "-c:a", "aac", "-b:a", "64k", "-movflags", "+faststart",
                                          str(encoded)], check=True, timeout=240)
                          if encoded.stat().st_size < 24_000_000:
                              break
                      else:
                          raise ValueError("MP4 exceeds the hosting file size limit")
                      info = json.loads(subprocess.check_output([
                          "ffprobe", "-v", "error", "-show_streams", "-of", "json", str(encoded)
                      ], text=True, timeout=15))
                      if not any(s.get("codec_name") == "h264" and float(s.get("duration", 0)) > 0
                                 for s in info["streams"]):
                          raise ValueError("No playable H.264 video track")
                      target.write_bytes(encoded.read_bytes())
                      print(f"Converted {url.rsplit('/', 1)[-1]} ({target.stat().st_size} bytes)", flush=True)
                  return True
              except (OSError, subprocess.SubprocessError, ValueError) as error:
                  print(f"::warning::{url.rsplit('/', 1)[-1]}: {error}", flush=True)
                  return False

          with ThreadPoolExecutor(max_workers=6) as workers:
              results = list(workers.map(convert, sources))
          Path("/tmp/flower-video-failures").write_text(str(results.count(False)))
          print(f"{sum(results)} of {len(results)} clips ready", flush=True)
          PY
      - name: Publish converted assets
        shell: bash
        run: |
          set -euo pipefail
          git add assets/products/converted
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Publish converted Flower product videos"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [[ $attempt = 3 ]]; then exit 1; fi
            done
          fi
          test "$(cat /tmp/flower-video-failures)" = 0
