name: Publish journal pages
on:
  push:
    branches: [main]
    paths:
      - 'content/journal/**'
      - 'scripts/build_journal.py'
      - '.github/workflows/publish-journal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate static journal pages
        run: python scripts/build_journal.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated journal pages"
            git push
          fi
