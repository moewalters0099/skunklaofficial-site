<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../styles.css?v=20261110-brand5"><title>Blog Posts | SKUNKLA Official</title></head><body><div class="announcement">WELCOME TO THE OFFICIAL SKUNKLA WEBSITE</div><header class="site-header"><a class="brand" href="../index.html"><img class="brand-image" src="../assets/skunk-logo-black.svg" alt="SKUNKLA"></a><nav aria-label="Main navigation"><a href="../index.html">Home</a><a href="../about.html">About</a><a href="./index.html">Blog Posts</a><a href="../contact.html">Contact</a></nav></header><main id="main"><section class="statement subpage-hero"><span class="kicker">THE JOURNAL</span><h1 class="page-heading">THE<br><i>JOURNAL.</i></h1><p>Brand stories and announcements.</p></section><section class="features"><div class="feature-grid"><div id="journal-posts" aria-live="polite"><p>Loading published articles…</p></div></div></section></main><footer><div class="footer-bottom"><small>© 2026 SKUNKLA. All rights reserved.</small><small>Informational website · No online purchases or payments</small></div></footer><script>
(async function(){
const target=document.getElementById('journal-posts');
const endpoint='https://api.github.com/repos/moewalters0099/skunklaofficial-site/contents/content/journal?ref=main';
function p(parent,tag,text){const el=document.createElement(tag);el.textContent=text;parent.appendChild(el);return el}
function parse(source){const m=source.match(/^---\\s*\\n([\\s\\S]*?)\\n---\\s*\\n?/);const meta={};if(m){for(const line of m[1].split('\\n')){const x=line.match(/^([a-zA-Z_]+):\\s*(.*)$/);if(x)meta[x[1]]=x[2].replace(/^["']|["']$/g,'')}}return {meta,body:m?source.slice(m[0].length):source}}
try{
 const listing=await fetch(endpoint,{headers:{Accept:'application/vnd.github+json'}});
 if(listing.status===404){target.replaceChildren();p(target,'p','No articles have been published yet.');return}
 if(!listing.ok)throw new Error('Unable to load the public article directory');
 const files=(await listing.json()).filter(x=>x.type==='file'&&/\\.md$/i.test(x.name)).slice(0,30);
 target.replaceChildren();if(!files.length){p(target,'p','No articles have been published yet.');return}
 const articles=await Promise.all(files.map(async file=>{
 const res=await fetch(file.download_url);if(!res.ok)throw new Error('Unable to load an article');
 const parsed=parse(await res.text());return {...parsed,filename:file.name}
 }));
 articles.sort((a,b)=>(b.meta.date||'').localeCompare(a.meta.date||''));
 for(const article of articles){const card=document.createElement('article');card.style.cssText='background:#fff;padding:24px;border:1px solid #ddd;margin-bottom:20px;max-width:850px';p(card,'h2',article.meta.title||article.filename.replace(/\\.md$/,''));if(article.meta.date)p(card,'small',article.meta.date);if(article.meta.summary)p(card,'p',article.meta.summary);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Read article';details.appendChild(summary);const body=p(details,'div',article.body);body.style.whiteSpace='pre-wrap';body.style.lineHeight='1.65';card.appendChild(details);target.appendChild(card)}
}catch(e){target.replaceChildren();p(target,'p','Articles could not be loaded right now. Please try again later.')}
})();
</script></body></html>
